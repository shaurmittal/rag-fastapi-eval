[project]
name = "rag-fastapi-eval"
version = "0.1.0"
description = "Ask questions about the FastAPI framework and get answers with sources, plus an evaluation harness that measures how often those answers are actually correct and how often they are made up."
readme = "README.md"
authors = [
    { name = "shaurmittal", email = "shaurmittal@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.1",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "requests>=2.34.2",
]

[tool.uv]
package = false
